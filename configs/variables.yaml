# =============================================================================
# VARIABLE MAPPING
# =============================================================================
# One entry per output measure. The entry name is the column stem written by
# the pre-processing step:
#     all_<name>_date, all_<name>_score, 1st_<name>_score, 1st_<name>_date,
#     Lst_<name>_score, Lst_<name>_date, nb_of_<name>_visits
# so two datasets that list the same name end up in the same columns after the
# merge.
#
# Entry keys
#   label, domain, unit, description   documentation (shown in docs/variables.md)
#   kind      score (default) | categorical | flag
#   expand    true -> placed into 6-month windows in MASTER_expanded_240m.csv
#   valid_range  [min, max] of the instrument, inherited by every source that
#             gives no valid_range of its own (valid_range: null in a source
#             turns it off); keeps codes such as 88 / 95-98 / 995-998 out
#   builtin   true -> produced by dataset code; sources are not read from here
#   sources   one block per dataset (or a list of blocks)
#
# Source keys (per dataset)
#   table          table key from configs/datasets/<dataset>.yaml
#                  (may be omitted for datasets with a default_table)
#   column         raw column, or a list of candidates (first one present wins)
#   date_column    date column, when it is not the table's usual visit date
#   transform      named transform: sum, mean, max, coalesce, difference,
#                  ratio, bmi, bmi_reported_or_computed (4RTNI also:
#                  sum_timepoint_items); see transforms.py to add your own
#   items          input columns of the transform
#   params         extra transform parameters (sum / mean / max:
#                  item_missing_values: [9] drops item codes before combining,
#                  item_valid_range: [0, 15] drops items outside the range;
#                  any source: item_recode: {-6: 0} recodes raw values first)
#   raw_missing_values  false -> ignore the dataset-wide raw_missing_values
#                  of datasets/<name>.yaml for this source
#   missing_values codes that mean "missing" (e.g. [-4, 88, 99])
#   valid_range    [min, max] (null = open end); values outside -> missing
#   range_inclusive  false -> the bounds themselves are excluded
#   valid_codes    keep only these codes (everything else -> missing)
#   row_filter     {column: ..., pattern: <regex>} keep only matching rows
#   case_insensitive  match column names regardless of case
#   instrument, suffix, date_suffix   4RTNI wide columns
#                  <instrument>_<timepoint>_<suffix> (empty suffix allowed)
#
# Example - a new variable present under different names in two datasets:
#
#   RAVLT_forgetting:
#     label: RAVLT forgetting (trial 5 minus delayed recall)
#     domain: memory
#     expand: true
#     sources:
#       ADNI: {table: neurobat, column: AVDEL30MIN}      # hypothetical name
#       PREVENTAD: {table: ravlt, transform: difference,
#                   items: [List_A_Trial_5, ListA_Delayed_Recall_Correct_Answer]}
#
# Run `inbrain-dementia check-config` after editing this file.
# =============================================================================
variables:
  TMT_A:
    label: Trail Making Test part A, time (s)
    domain: executive_attention
    expand: true
    valid_range: [0, 900]
    sources:
      ADNI: {table: neurobat, column: TRAASCOR}
      ABVIB: {table: npsych, column: TRAILA}
      4RTNI: {instrument: UDSTRAILS, suffix: TRAILA, date_suffix: DATE}
      PREVENTAD: {table: tmt, column: TMT_A_time}
      OASIS: {table: neuro, column: tma}
      NACC:
        transform: coalesce
        items: [TRAILA, OTRAILA]
        note: UDS v3 TRAILA, else v2 OTRAILA
  TMT_B:
    label: Trail Making Test part B, time (s)
    domain: executive_attention
    expand: true
    valid_range: [0, 900]
    sources:
      ADNI: {table: neurobat, column: TRABSCOR}
      ABVIB: {table: npsych, column: TRAILB}
      4RTNI: {instrument: UDSTRAILS, suffix: TRAILB, date_suffix: DATE}
      PREVENTAD: {table: tmt, column: TMT_B_time}
      OASIS: {table: neuro, column: tmb}
      NACC:
        transform: coalesce
        items: [TRAILB, OTRAILB]
        note: UDS v3 TRAILB, else v2 OTRAILB
  BNT:
    label: Boston Naming Test, total correct
    domain: language
    expand: true
    valid_range: [0, 60]
    sources:
      ADNI: {table: neurobat, column: BNTTOTAL}
      NIFD: {column: BNTCORR, date_column: CLINICAL_LINKDATE}
      ABVIB: {table: npsych, column: BOSTON}
      OASIS: {table: neuro, column: bnt}
      NACC: {column: BOSTON}
  MINT:
    label: Multilingual Naming Test, total
    domain: language
    valid_range: [0, 32]
    sources:
      ADNI: {table: neurobat, column: MINTTOTAL}
      OASIS: {table: neuro, column: mintscnc}
      NACC: {column: MINTTOTS}
  RAVLT_T1:
    label: RAVLT trial 1 (words recalled, 0-15)
    domain: memory
    valid_range: [0, 15]
    sources:
      ADNI: {table: neurobat, column: AVTOT1}
      PREVENTAD: {table: ravlt, column: ListA_Recall1_Correct_Answers}
      NACC: {column: REY1REC}
  RAVLT_I:
    label: RAVLT immediate recall, total of trials 1-5 (0-75)
    domain: memory
    valid_range: [0, 75]
    sources:
      ADNI:
        table: neurobat
        transform: sum
        items: [AVTOT1, AVTOT2, AVTOT3, AVTOT4, AVTOT5]
        params: {min_count: 5}
        note: computed from the five trials (all required)
      PREVENTAD: {table: ravlt, column: List_A_Sum_Trials_1_5}
      NACC:
        transform: sum
        items: [REY1REC, REY2REC, REY3REC, REY4REC, REY5REC]
        params: {min_count: 5, item_valid_range: [0, 15]}
        note: computed from the five trials (all required); item codes 88 / 95-98 / -4 dropped
  RAVLT_D:
    label: RAVLT delayed recall after ~30 min (words recalled, 0-15)
    domain: memory
    valid_range: [0, 15]
    sources:
      ADNI: {table: neurobat, column: AVDEL30MIN}
      PREVENTAD: {table: ravlt, column: ListA_Delayed_Recall_Correct_Answer}
      NACC: {column: REYDREC}
  LM_I:
    label: Logical Memory, immediate recall
    domain: memory
    expand: true
    valid_range: [0, 25]
    sources:
      ADNI: {table: neurobat, column: LIMMTOTAL}
      AIBL: {table: neurobat, column: LIMMTOTAL}
      ABVIB: {table: npsych, column: LOGIMEM}
      A4: {table: coglogic, column: LIMMTOTAL}
      OASIS: {table: neuro, column: LOGIMEM}
      NACC: {column: LOGIMEM}
  LM_II:
    label: Logical Memory, delayed recall
    domain: memory
    expand: true
    valid_range: [0, 25]
    sources:
      ADNI: {table: neurobat, column: LDELTOTAL}
      AIBL: {table: neurobat, column: LDELTOTAL}
      ABVIB: {table: npsych, column: MEMUNITS}
      A4: {table: coglogic, column: LDELTOTAL}
      OASIS: {table: neuro, column: MEMUNITS}
      NACC: {column: MEMUNITS}
  Clock_Command:
    label: Clock drawing to command
    domain: visuospatial
    sources:
      ADNI: {table: neurobat, column: CLOCKSCOR}
  Clock_Copy:
    label: Clock copy
    domain: visuospatial
    sources:
      ADNI: {table: neurobat, column: COPYSCOR}
  DS_Fwd:
    label: Digit span forward
    domain: attention
    valid_range: [0, 14]
    sources:
      ADNI: {table: neurobat, column: DSPANFOR}
      NIFD: {column: DIGITFW, date_column: CLINICAL_LINKDATE}
      ABVIB: {table: npsych, column: DIGIF}
      4RTNI: {instrument: DSPAN, suffix: DIGITFW, date_suffix: DATE}
      OASIS: {table: neuro, column: DIGIF}
      NACC: {column: DIGIF}
  DS_Back:
    label: Digit span backward
    domain: attention
    valid_range: [0, 14]
    sources:
      ADNI: {table: neurobat, column: DSPANBAC}
      NIFD: {column: DIGITBW, date_column: CLINICAL_LINKDATE}
      ABVIB: {table: npsych, column: DIGIB}
      4RTNI: {instrument: DSPAN, suffix: DIGITBW, date_suffix: DATE}
      OASIS: {table: neuro, column: DIGIB}
      NACC: {column: DIGIB}
  DigSym:
    label: Digit Symbol Substitution / WAIS coding
    domain: processing_speed
    expand: true
    valid_range: [0, 93]
    sources:
      ADNI: {table: neurobat, column: DIGITSCOR}
      ABVIB: {table: npsych, column: WAIS}
      4RTNI: {instrument: DSYM, suffix: '', date_suffix: DATE}
      A4: {table: cogdigit, column: DIGITTOTAL}
      OASIS: {table: neuro, column: digsym}
      NACC: {column: WAIS}
  VF_anim:
    label: Category fluency, animals
    domain: language
    expand: true
    valid_range: [0, 77]
    sources:
      ADNI: {table: neurobat, column: CATANIMSC}
      NIFD: {column: ANCORR, date_column: CLINICAL_LINKDATE}
      ABVIB: {table: npsych, column: ANIMALS}
      4RTNI: {instrument: VERBFLU_AN, suffix: ANCORR, date_suffix: DATE}
      OASIS: {table: neuro, column: ANIMALS}
      NACC: {column: ANIMALS}
  VF_veg:
    label: Category fluency, vegetables
    domain: language
    valid_range: [0, 77]
    sources:
      ADNI: {table: neurobat, column: CATVEGESC}
      ABVIB: {table: npsych, column: VEG}
      OASIS: {table: neuro, column: VEG}
  MMSE:
    label: Mini-Mental State Examination, total
    domain: global_cognition
    expand: true
    valid_range: [0, 30]
    sources:
      ADNI: {table: mmse, column: MMSCORE}
      AIBL: {table: mmse, column: MMSCORE}
      NIFD: {column: MMSE_TOT, date_column: MMSE_DCDATE}
      ABVIB: {table: npsych, column: MMSE}
      MCSA: {column: MMSEcalc}
      4RTNI: {instrument: MMSE, suffix: MMSETOT, date_suffix: DATE}
      A4: {table: mmse, column: MMSCORE}
      OASIS: {table: cdr, column: MMSE}
      NACC: {column: NACCMMSE}
  MoCA:
    label: Montreal Cognitive Assessment, total
    domain: global_cognition
    expand: true
    valid_range: [0, 30]
    sources:
      ADNI: {table: moca, column: MOCA}
      NIFD: {column: MOCA_TotWithEduc, date_column: MOCA_DCDATE}
      4RTNI: {instrument: MOCA, suffix: MOCATOTWITHEDUC, date_suffix: DATE}
      PREVENTAD: {table: el_cdr_moca, column: MOCA_total_score}
      OASIS: {table: neuro, column: mocatots}
      NACC: {column: NACCMOCA}
  DS_Fwd_MoCA:
    domain: attention
    sources:
      ADNI: {table: moca, column: DIGFOR}
  DS_Back_MoCA:
    domain: attention
    sources:
      ADNI: {table: moca, column: DIGBACK}
  CDR:
    label: Clinical Dementia Rating, global
    domain: global_staging
    expand: true
    valid_range: [0, 3]
    sources:
      ADNI: {table: cdr, column: CDGLOBAL}
      AIBL: {table: cdr, column: CDGLOBAL}
      NIFD: {column: CDR_TOT, date_column: CDR_DCDATE}
      ABVIB: {table: cdr, column: CDRGLOB}
      MCSA: {column: CDRGLOB}
      4RTNI: {instrument: CDR, suffix: CDRTOT, date_suffix: DATE}
      A4: {table: cdr, column: CDGLOBAL}
      PREVENTAD: {table: el_cdr_moca, column: CDR_total_score}
      OASIS: {table: cdr, column: CDRTOT}
      NACC: {column: CDRGLOB}
  CDR_SB:
    label: Clinical Dementia Rating, sum of boxes
    domain: global_staging
    expand: true
    valid_range: [0, 18]
    sources:
      ADNI: {table: cdr, column: CDRSB}
      NIFD: {column: CDR_BOX_SCORE, date_column: CDR_DCDATE}
      ABVIB: {table: cdr, column: CDRSUM}
      MCSA: {column: CDRSUM}
      4RTNI: {instrument: CDR, suffix: BOXSCORE, date_suffix: DATE}
      A4: {table: cdr, column: CDSOB}
      OASIS: {table: cdr, column: CDRSUM}
      NACC: {column: CDRSUM}
  GDS:
    label: Geriatric Depression Scale
    domain: mood
    expand: true
    valid_range: [0, 15]
    sources:
      ADNI: {table: gds, column: GDTOTAL}
      ABVIB: {table: gds, column: GDS}
      A4: {table: psychwell, column: GDTOTAL}
      OASIS: {table: gds, column: GDS}
      NACC: {column: NACCGDS}
  FAQ:
    label: Functional Activities Questionnaire, total
    domain: function
    expand: true
    valid_range: [0, 30]
    sources:
      ADNI: {table: faq, column: FAQTOTAL}
      NIFD: {column: FAQ_TOTAL, date_column: FAQ_DCDATE}
      MCSA: {column: faq_total}
      4RTNI: {instrument: FAQ, suffix: FAQTOT, date_suffix: DATE}
  NPI:
    label: Neuropsychiatric Inventory (Questionnaire), total
    domain: behaviour
    expand: true
    valid_range: [0, 36]
    sources:
      ADNI: {table: npiq, column: NPISCORE}
      NIFD:
        transform: sum
        items: [NPI_DELSEV, NPI_HALLSEV, NPI_AGITSEV, NPI_DEPDSEV, NPI_ANXSEV, NPI_ELATSEV, NPI_APASEV, NPI_DISNSEV, NPI_IRRSEV,
          NPI_MOTSEV, NPI_NITESEV, NPI_APPSEV]
        params: {item_recode: {-6: 0}, min_count: 12}
        date_column: NPI_DCDATE
        note: severity -6 (logical skip, symptom absent) counts as 0; the total needs all 12 items
      4RTNI:
        instrument: NPIQ
        transform: sum_timepoint_items
        items: [DELSEV, HALSEV, AGSEV, DEPSEV, ANXSEV, EUPSEV, APTHSEV, DISSEV, IRRSEV, MOTSEV, SLESEV, EATSEV]
        date_suffix: DATE
        note: sum of the 12 NPI-Q severity items per timepoint
  STAI:
    label: State-Trait Anxiety Inventory (ADNI 6-item sum)
    domain: mood
    sources:
      ADNI:
        table: stai
        transform: sum
        items: [STAIAD1, STAIAD2, STAIAD3, STAIAD4, STAIAD5, STAIAD6]
      A4: {table: psychwell, column: STAITOTAL}
  ECOG_PT:
    label: Everyday Cognition 12-item, participant (sum of answered items; 9 = don't know excluded)
    domain: function
    sources:
      ADNI:
        table: ecog_pt
        transform: sum
        items: [ECOGPT1, ECOGPT2, ECOGPT3, ECOGPT4, ECOGPT5, ECOGPT6, ECOGPT7, ECOGPT8, ECOGPT9, ECOGPT10, ECOGPT11, ECOGPT12]
        date_column: COLDATE
        params: {item_missing_values: [9]}
  ECOG_SP:
    label: Everyday Cognition 12-item, study partner (sum of answered items; 9 = don't know excluded)
    domain: function
    sources:
      ADNI:
        table: ecog_sp
        transform: sum
        items: [ECOGSP1, ECOGSP2, ECOGSP3, ECOGSP4, ECOGSP5, ECOGSP6, ECOGSP7, ECOGSP8, ECOGSP9, ECOGSP10, ECOGSP11, ECOGSP12]
        date_column: COLDATE
        params: {item_missing_values: [9]}
  Height:
    label: Height (units of the source)
    domain: vitals
    expand: true
    sources:
      ADNI: {table: vitals, column: VSHEIGHT}
      MCSA: {column: HT}
      A4: {table: vitals, column: VSHEIGHT}
      OASIS: {table: vitals, column: HEIGHT}
      NACC:
        column: HEIGHT
        missing_values: [888, 888.8, 999, 999.9, 8888, 9999, 88.8, 99.9]
        valid_range: [0, null]
        range_inclusive: false
  Weight:
    label: Weight (units of the source)
    domain: vitals
    expand: true
    sources:
      ADNI: {table: vitals, column: VSWEIGHT}
      MCSA: {column: WT}
      A4: {table: vitals, column: VSWEIGHT}
      PREVENTAD: {table: bp_weight, column: Weight}
      OASIS: {table: vitals, column: WEIGHT}
      NACC:
        column: WEIGHT
        missing_values: [888, 888.8, 999, 999.9, 8888, 9999, 88.8, 99.9]
        valid_range: [0, null]
        range_inclusive: false
  BP_Sys:
    label: Systolic blood pressure (mmHg)
    domain: vitals
    sources:
      ADNI: {table: vitals, column: VSBPSYS}
      MCSA: {column: SysBPAvg}
      A4: {table: vitals, column: VSBPSYS}
      PREVENTAD: {table: bp_weight, column: Systolic_blood_pressure}
      OASIS: {table: vitals, column: BPSYS}
      NACC: {column: BPSYS}
  BP_Dias:
    label: Diastolic blood pressure (mmHg)
    domain: vitals
    sources:
      ADNI:
        table: vitals
        column: [VSBPDIA, VSBPDIAS]
        note: column name varies across ADNI phases
      MCSA: {column: DiaBPAvg}
      A4: {table: vitals, column: VSBPDIA}
      PREVENTAD: {table: bp_weight, column: Diastolic_blood_pressure}
      OASIS: {table: vitals, column: BPDIAS}
      NACC: {column: BPDIAS}
  BMI:
    label: Body-mass index (kg/m2)
    domain: vitals
    expand: true
    description: PREVENT-AD BMI is computed in code from visit weight and the eligibility height.
    sources:
      ADNI:
        table: vitals
        transform: bmi
        params:
          weight: VSWEIGHT
          height: VSHEIGHT
          weight_unit_column: VSWTUNIT
          height_unit_column: VSHTUNIT
      MCSA: {column: BMI}
      A4:
        table: vitals
        transform: bmi
        params:
          weight: VSWEIGHT
          height: VSHEIGHT
          weight_unit_column: VSWTUNIT
          height_unit_column: VSHTUNIT
      OASIS:
        table: vitals
        transform: bmi
        case_insensitive: true
        params: {weight: WEIGHT, height: HEIGHT, weight_unit: lb, height_unit: in}
      NACC:
        transform: bmi_reported_or_computed
        params:
          bmi_column: NACCBMI
          weight: WEIGHT
          height: HEIGHT
          weight_unit: lb
          height_unit: in
        note: NACCBMI when 10-80, else computed from lb / in
  VF_D:
    domain: language
    sources:
      NIFD: {column: DCORR, date_column: CLINICAL_LINKDATE}
      4RTNI: {instrument: VERBFLU_DWORDS, suffix: DCORR, date_suffix: DATE}
  CVLT_total:
    domain: memory
    sources:
      NIFD: {column: TRCOTOT, date_column: CLINICAL_LINKDATE}
      4RTNI: {instrument: CVLT, suffix: TRCOTOT, date_suffix: DATE}
  CVLT_30s:
    domain: memory
    sources:
      NIFD: {column: CORR30, date_column: CLINICAL_LINKDATE}
      4RTNI: {instrument: CVLT, suffix: CORR30, date_suffix: DATE}
  CVLT_10m:
    domain: memory
    sources:
      NIFD: {column: CORR10, date_column: CLINICAL_LINKDATE}
      4RTNI: {instrument: CVLT, suffix: CORR10, date_suffix: DATE}
  CVLT_recog:
    domain: memory
    sources:
      NIFD: {column: RECOG, date_column: CLINICAL_LINKDATE}
      4RTNI: {instrument: CVLT, suffix: RECOG, date_suffix: DATE}
  ModTrails_T:
    domain: executive_attention
    sources:
      NIFD: {column: MTTTIME, date_column: CLINICAL_LINKDATE}
      4RTNI: {instrument: MTRAILS, suffix: MTTIME, date_suffix: DATE}
  ModTrails_C:
    domain: executive_attention
    sources:
      NIFD: {column: MTCORR, date_column: CLINICAL_LINKDATE}
      4RTNI: {instrument: MTRAILS, suffix: MTCORR, date_suffix: DATE}
  GDS_30:
    domain: mood
    sources:
      NIFD: {column: GDSTOT, date_column: CLINICAL_LINKDATE}
      4RTNI: {instrument: GDS, suffix: GDSTOT, date_suffix: DATE}
  GDS_15:
    domain: mood
    sources:
      NIFD: {column: GDS15TO, date_column: CLINICAL_LINKDATE}
      4RTNI: {instrument: GDS, suffix: GDS15TO, date_suffix: DATE}
  SEADL:
    domain: function
    sources:
      NIFD: {column: SEADL, date_column: SEADL_DCDATE}
      4RTNI: {instrument: SEADL, suffix: '', date_suffix: DATE}
  CGI_sev:
    domain: global_cognition
    sources:
      NIFD: {column: CGI_SEVERITY, date_column: CGI_DCDATE}
      4RTNI: {instrument: CGI_S, suffix: '', date_suffix: DATE}
  CGI_chg:
    domain: global_cognition
    sources:
      NIFD: {column: CGI_CHANGE, date_column: CGI_DCDATE}
      4RTNI: {instrument: CGI_C, suffix: '', date_suffix: DATE}
  PSPRS:
    domain: motor
    sources:
      NIFD: {column: PSPRS_TOTAL, date_column: PSPRS_DC_DATE}
      4RTNI: {instrument: PSPRS, suffix: TOTAL, date_suffix: DATE}
  BIS:
    domain: behaviour
    sources:
      NIFD: {column: BIS_TOT, date_column: BISBAS_DCDATE}
      4RTNI: {instrument: BIS, suffix: BIS_TOT, date_suffix: DATE}
  BAS:
    domain: behaviour
    sources:
      NIFD: {column: BAS_TOT, date_column: BISBAS_DCDATE}
  IRI_EC:
    domain: behaviour
    sources:
      NIFD: {column: IRI_FTDIRIEC, date_column: IRI_DCDATE}
      4RTNI: {instrument: IRI, suffix: IRIEC, date_suffix: DATE}
  IRI_PT:
    domain: behaviour
    sources:
      NIFD: {column: IRI_FTDIRIPT, date_column: IRI_DCDATE}
      4RTNI: {instrument: IRI, suffix: IRIPT, date_suffix: DATE}
  UPDRS:
    domain: motor
    sources:
      NIFD: {column: MDEXAM_UPDRS, date_column: MDEXAM_DCDATE}
      MCSA: {column: TOT_MOD_UPDRS}
      4RTNI: {instrument: UPDRS, suffix: TOTAL, date_suffix: DATE}
  UHDRS:
    domain: motor
    sources:
      NIFD: {column: MDEXAM_UHDRS, date_column: MDEXAM_DCDATE}
  LM_I_cog:
    domain: memory
    valid_range: [0, 25]
    sources:
      ABVIB: {table: cogscor, column: LMIAI}
  VF_anim_cog:
    domain: language
    valid_range: [0, 77]
    sources:
      ABVIB: {table: cogscor, column: CFTOTANI}
  VF_F_cog:
    domain: language
    valid_range: [0, 77]
    sources:
      ABVIB: {table: cogscor, column: CFTOTALF}
  DigSym_cog:
    domain: attention
    valid_range: [0, 93]
    sources:
      ABVIB: {table: cogscor, column: WAISRTOT}
  BNT_30:
    domain: language
    valid_range: [0, 30]
    sources:
      ABVIB: {table: cogscor, column: BNTCORR30}
  BNT_60:
    domain: language
    valid_range: [0, 60]
    sources:
      ABVIB: {table: cogscor, column: BNTCORR60}
  TMT_A_cog:
    domain: executive_attention
    valid_range: [0, 900]
    sources:
      ABVIB: {table: cogscor, column: TRAILSA}
  TMT_B_cog:
    domain: executive_attention
    valid_range: [0, 900]
    sources:
      ABVIB: {table: cogscor, column: TRAILSB}
  GDS_cog:
    domain: mood
    valid_range: [0, 15]
    sources:
      ABVIB: {table: cogscor, column: GDS}
  VF_A_cog:
    domain: language
    valid_range: [0, 77]
    sources:
      ABVIB: {table: cogscor, column: VFTOTALA}
  VF_S_cog:
    domain: language
    valid_range: [0, 77]
    sources:
      ABVIB: {table: cogscor, column: VFTOTALS}
  Glucose:
    label: Blood glucose
    domain: lab
