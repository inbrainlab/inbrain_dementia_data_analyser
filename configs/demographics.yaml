  b: A
  a: A
  right-handed: R
  left-handed: L
  ambidextrous: A
  right: R
  left: L
education_sentinels: [88, 99, 888, 999]
education_max_years: 40
nacc_old_apoe_fix:
  e2/e2: e3/e3
  e2/e3: e3/e4
  e2/e4: e2/e3
  e3/e3: e4/e4
  e3/e4: e2/e4
  e4/e4: e2/e2
