# =============================================================================
# COLUMN-NAME HARMONISATION (applied by integration.merge, per dataset)
# =============================================================================
# global_rename  exact 1:1 renames applied to every dataset
# column_rename  exact renames per dataset (applied before family_rename)
# family_rename  rename a whole measure family per dataset: every column
#                whose name contains the stem as a '_'-delimited token, e.g.
#                ADNI T1w -> MRI_T1w renames all_T1w_date, T1w_IDs, nb_total_T1w...
#                A stem that already carries the canonical prefix is left alone.
# age_priority   first available column becomes age_at_baseline
# =============================================================================
global_rename:
  education_years: education
  retirement_status: retired
column_rename:
  AIBL:
    all_AXT117_values: all_Lab_TSH_AIBL_score
    all_AXT117_date: all_Lab_TSH_AIBL_date
